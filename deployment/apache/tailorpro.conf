# ==============================================================================
# TailorPro Production Apache Virtual Host Configuration
# Place in: /etc/apache2/sites-available/tailorpro.conf (Debian/Ubuntu)
# or conf.d/tailorpro.conf (RHEL/CentOS)
# ==============================================================================

<VirtualHost *:80>
    ServerName tailorpro.yourdomain.com
    ServerAdmin webmaster@yourdomain.com

    DocumentRoot /var/www/tailorpro/public

    <Directory /var/www/tailorpro/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Enable Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain text/html text/xml text/css application/xml application/xhtml+xml application/rss+xml application/javascript application/x-javascript application/json image/svg+xml font/woff font/woff2
    </IfModule>

    # Static Assets Caching
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpg "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
        ExpiresByType text/css "access plus 1 year"
        ExpiresByType application/javascript "access plus 1 year"
        ExpiresByType font/woff2 "access plus 1 year"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/tailorpro_error.log
    CustomLog ${APACHE_LOG_DIR}/tailorpro_access.log combined
</VirtualHost>
