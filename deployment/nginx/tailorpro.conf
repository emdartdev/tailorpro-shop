# ==============================================================================
# TailorPro Production Nginx Virtual Host Configuration
# Place in: /etc/nginx/sites-available/tailorpro.conf
# Symlink to: /etc/nginx/sites-enabled/
# ==============================================================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tailorpro.yourdomain.com; # Replace with your production domain

    return 301 https://$host$request_uri;
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tailorpro.yourdomain.com; # Replace with your production domain

    # SSL Certificates (Managed by Certbot or Cloudflare)
    # ssl_certificate /etc/letsencrypt/live/tailorpro.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tailorpro.yourdomain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/tailorpro/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 25M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff font/woff2;

    # SPA & Laravel Routing Fallback
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static Vite Assets - Long-term caching (1 year)
    location ~* ^/build/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Favicon and Robots.txt
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Error Pages
    error_page 404 /index.php;

    # PHP-FPM Handler
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Adjust PHP version (php8.2, php8.3)
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
